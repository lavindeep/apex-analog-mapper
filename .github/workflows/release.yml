name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    name: Build and publish release
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Derive version from tag
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            Write-Error "Tag '$env:GITHUB_REF_NAME' does not look like a semantic version"
            exit 1
          }
          Add-Content -Path $env:GITHUB_ENV -Value "PRODUCT_VERSION=$version"
      - name: Publish app + supervisor (self-contained win-x64) into one dir
        run: |
          # App first, supervisor second, into the same staging directory. Both
          # are self-contained so the shared runtime files are identical; the
          # second publish only adds ApexMapper.Supervisor.exe and its config.
          # MSI ProductVersion rejects prerelease suffixes, so binaries carry
          # the full tag version while the MSI uses the numeric part.
          $numeric = ($env:PRODUCT_VERSION -split '-')[0]
          dotnet publish src/ApexMapper.App/ApexMapper.App.csproj `
            -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false `
            -p:Version=$env:PRODUCT_VERSION -o staging
          dotnet publish src/ApexMapper.Supervisor/ApexMapper.Supervisor.csproj `
            -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false `
            -p:Version=$env:PRODUCT_VERSION -o staging
          Add-Content -Path $env:GITHUB_ENV -Value "MSI_VERSION=$numeric"
      - name: Assert staging layout
        run: |
          $staging = (Resolve-Path staging).Path
          $required = @(
            'ApexMapper.exe',
            'ApexMapper.Supervisor.exe',
            'ApexMapper.runtimeconfig.json',
            'ApexMapper.Supervisor.runtimeconfig.json'
          )
          foreach ($name in $required) {
            $path = Join-Path $staging $name
            if (-not (Test-Path $path)) {
              Write-Error "Expected staged file missing: $path"
              exit 1
            }
          }
          Write-Host "Staging layout OK: both executables and runtimeconfig files present in $staging"
      - name: Build MSI
        run: |
          $staging = (Resolve-Path staging).Path
          dotnet build installer/ApexAnalogMapper.wixproj `
            -c Release -p:StagingDir=$staging -p:ProductVersion=$env:MSI_VERSION
      - name: Verify MSI co-locates app and supervisor
        run: |
          $msi = Get-ChildItem -Path installer/bin -Recurse -Filter *.msi | Select-Object -First 1
          if (-not $msi) { Write-Error "No MSI was produced under installer/bin"; exit 1 }
          $extract = Join-Path $PWD 'extract'
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          # Administrative install lays out the source image without running an
          # actual install. Start-Process -Wait handles msiexec's async return.
          $proc = Start-Process msiexec `
            -ArgumentList "/a `"$($msi.FullName)`" /qn TARGETDIR=`"$extract`"" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            Write-Error "msiexec /a failed with exit code $($proc.ExitCode)"
            exit 1
          }
          $exes  = Get-ChildItem -Path $extract -Recurse -Filter *.exe
          $appEx = $exes | Where-Object { $_.Name -eq 'ApexMapper.exe' } | Select-Object -First 1
          $supEx = $exes | Where-Object { $_.Name -eq 'ApexMapper.Supervisor.exe' } | Select-Object -First 1
          if (-not $appEx) { Write-Error "ApexMapper.exe not found in extracted MSI image"; exit 1 }
          if (-not $supEx) { Write-Error "ApexMapper.Supervisor.exe not found in extracted MSI image"; exit 1 }
          if ($appEx.DirectoryName -ne $supEx.DirectoryName) {
            Write-Error "App and supervisor are not co-located: '$($appEx.DirectoryName)' vs '$($supEx.DirectoryName)'"
            exit 1
          }
          Write-Host "MSI verified: co-located in $($appEx.DirectoryName)"
      - name: Stage release assets with checksums
        run: |
          $msi = Get-ChildItem -Path installer/bin -Recurse -Filter *.msi | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $asset = "release-assets/apex-analog-mapper-$env:PRODUCT_VERSION.msi"
          Copy-Item $msi.FullName $asset
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  apex-analog-mapper-$env:PRODUCT_VERSION.msi" |
            Set-Content -Path release-assets/SHA256SUMS.txt -Encoding ascii
          Get-Content release-assets/SHA256SUMS.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The annotated tag message is the release notes: one honest source.
          # checkout peels the triggering tag to a lightweight ref, losing the
          # annotation, so re-fetch the real tag object and read it directly.
          git fetch origin --force "+refs/tags/$($env:GITHUB_REF_NAME):refs/tags/$($env:GITHUB_REF_NAME)"
          git tag -l --format='%(contents)' $env:GITHUB_REF_NAME |
            Set-Content -Path release-notes.md -Encoding utf8
          if (-not (Get-Content release-notes.md | Where-Object { $_.Trim() })) {
            Write-Error "Tag $env:GITHUB_REF_NAME has no annotation to use as release notes"
            exit 1
          }
          $flags = @('--verify-tag', '--notes-file', 'release-notes.md', '--title', "Apex Analog Mapper $env:PRODUCT_VERSION")
          if ($env:PRODUCT_VERSION -like '*-*') { $flags += '--prerelease' }
          gh release create $env:GITHUB_REF_NAME `
            "release-assets/apex-analog-mapper-$env:PRODUCT_VERSION.msi" `
            "release-assets/SHA256SUMS.txt" `
            @flags
