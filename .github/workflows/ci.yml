name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:

jobs:
  build-and-test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore ApexAnalogMapper.sln
      - name: Build
        run: dotnet build ApexAnalogMapper.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test ApexAnalogMapper.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: "**/TestResults/**/*.trx"

  build-and-test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore ApexAnalogMapper.CrossPlatform.slnf
      - name: Build
        run: dotnet build ApexAnalogMapper.CrossPlatform.slnf --configuration Release --no-restore
      - name: Test
        run: dotnet test ApexAnalogMapper.CrossPlatform.slnf --configuration Release --no-build
