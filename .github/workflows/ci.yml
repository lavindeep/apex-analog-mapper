name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.0
      - name: Restore
        run: dotnet restore ApexAnalogMapper.slnx
      - name: Build
        run: dotnet build ApexAnalogMapper.slnx -c Release --no-restore
      - name: Test
        run: dotnet test ApexAnalogMapper.slnx -c Release --no-build
      - name: Pack
        # Velopack rejects versions below 0.0.1.
        run: scripts/pack.ps1 -Version "0.1.0-ci.${{ github.run_number }}"
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: apex-analog-mapper-ci-${{ github.run_number }}
          path: releases/
          retention-days: 7
          if-no-files-found: error
